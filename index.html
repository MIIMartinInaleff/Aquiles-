<style>
/* Layout: menú fijo a la izquierda, contenido aireado sin bordes; tres pieles premium sobre negro (violeta, oro, platino) que comparten estructura. */
:root{
  color-scheme:dark;
  --bg:#08070b; --panel:#111017; --panel2:#18161f; --ink:#f4f2f8; --muted:#8f899c; --line:#1f1c28;
  --acc:#b69cff; --grad:linear-gradient(135deg,#7c3aed 0%,#c026d3 100%); --on:#ffffff; --acc-soft:rgba(167,139,250,.13);
  --shadow:0 10px 30px rgba(124,58,237,.30); --bar:#2c2838;
  --glow:radial-gradient(900px 340px at 90% -120px,rgba(124,58,237,.20),transparent 70%);
  --ok:#4ade80; --ok-soft:rgba(74,222,128,.12); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.12);
  --late:#fb7185; --late-soft:rgba(251,113,133,.13); --off:#8f899c; --off-soft:rgba(255,255,255,.06);
  --side:#050407; --side-line:#16141d;
  --display:"Sora","Segoe UI",Arial,sans-serif; --dw:600; --dtrack:-.02em;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
:root[data-skin="oro"]{
  --bg:#000000; --panel:#0c0a08; --panel2:#16120d; --ink:#ffffff; --muted:#cfc5b1; --line:rgba(255,196,64,.16);
  --acc:#ffc93c; --grad:linear-gradient(120deg,#fff27a 0%,#ffc21a 38%,#ff7a1a 72%,#ff4a24 100%); --on:#170800; --acc-soft:rgba(255,201,60,.13);
  --fire:linear-gradient(90deg,#ffe14d 0%,#ff9a1f 45%,#ff2e2e 100%);
  --firev:linear-gradient(0deg,#e8121b 0%,#ff7a1a 55%,#ffe14d 100%);
  --red:#ff3b3b;
  --shadow:0 10px 32px rgba(255,90,30,.32); --bar:rgba(255,201,60,.20);
  --glow:radial-gradient(900px 360px at 92% -140px,rgba(255,40,40,.20),transparent 70%),radial-gradient(700px 300px at 55% -160px,rgba(255,200,40,.12),transparent 70%);
  --ok:#5ee08f; --warn:#ffd34d; --warn-soft:rgba(255,211,77,.13); --late:#ff5c5c; --late-soft:rgba(255,60,60,.15);
  --off:#cfc5b1; --off-soft:rgba(255,255,255,.07);
  --side:#000000; --side-line:rgba(255,196,64,.13);
  --display:"Archivo","Arial Black",Arial,sans-serif; --dw:800; --dtrack:-.01em;
  --r:16px;
}
:root[data-skin="oro"] .box,:root[data-skin="oro"] .tbl,:root[data-skin="oro"] .strip,:root[data-skin="oro"] .search,:root[data-skin="oro"] .ci-hit{border:1px solid var(--line)}
:root[data-skin="oro"] .chip:not([aria-pressed="true"]),:root[data-skin="oro"] .seg{border:1px solid var(--line);background:transparent;color:var(--ink)}
:root[data-skin="oro"] .nav{color:#e9e1d0}

.trf-a{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#ff3b3b;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.alert{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;margin-bottom:18px;padding:14px 18px;border-radius:var(--r);border:1px solid rgba(255,211,77,.45);background:var(--warn-soft);color:var(--ink)}
.alert span{color:var(--acc);font-weight:800}.alert:focus-visible{outline:2px solid var(--acc)}
@media (max-width:860px){.badge{position:absolute;top:4px;right:10px;margin:0}.nav{position:relative}}

/* ---- estética v2 ---- */
.tr-list{display:flex;flex-direction:column;gap:10px}
.tr-row{display:grid;grid-template-columns:52px minmax(170px,1.2fr) auto minmax(200px,1.5fr) auto;gap:16px;align-items:center;padding:14px 18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--ok)}
.tr-row.sin{box-shadow:inset 3px 0 0 var(--warn)}
.tr-hora{font-weight:800;font-variant-numeric:tabular-nums}
.tr-quien b,.tr-socio b{font-size:15px}
.tr-monto{font-family:var(--display);font-stretch:115%;font-weight:800;font-size:18px;white-space:nowrap;background:var(--fire,var(--grad));-webkit-background-clip:text;background-clip:text;color:transparent}
.tr-row .trf-a{justify-content:flex-end}
@media (max-width:1240px){.tr-row{grid-template-columns:52px minmax(0,1fr) auto}.tr-socio{grid-column:2/-1}.tr-row .trf-a{grid-column:2/-1;justify-content:flex-start}}
@media (max-width:540px){.tr-row{grid-template-columns:minmax(0,1fr) auto;gap:10px}.tr-hora{grid-column:1/-1;font-size:13px;color:var(--muted)}.tr-socio,.tr-row .trf-a{grid-column:1/-1}}
:root[data-skin="oro"]{--card:linear-gradient(160deg,rgba(255,196,64,.07) 0%,rgba(255,60,40,.025) 45%,rgba(255,255,255,.012) 100%),#0a0806}
:root[data-skin="oro"] body{background:radial-gradient(1100px 520px at 100% 0,rgba(255,60,40,.13),transparent 60%),radial-gradient(900px 600px at 0 100%,rgba(255,190,40,.07),transparent 60%),#000;background-attachment:fixed}
:root[data-skin="oro"] main{background:none}
h1,h2,.kpi b,.clock b,.brand b,.total>b,.tip-big,.trf-m{font-stretch:118%}
:root[data-skin="oro"] h1{font-size:clamp(30px,3vw,42px);letter-spacing:-.02em}
:root[data-skin="oro"] h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:10px}
:root[data-skin="oro"] h2::before{content:"";width:14px;height:3px;border-radius:2px;background:var(--fire)}
:root[data-skin="oro"] .sheet-h h2::before,:root[data-skin="oro"] .tip h2::before{display:none}
:root[data-skin="oro"] .app{grid-template-columns:248px minmax(0,1fr)}
:root[data-skin="oro"] .side{margin:12px 0 12px 12px;height:calc(100vh - 68px);top:12px;border-radius:22px;border:1px solid rgba(255,196,64,.18);background:linear-gradient(180deg,rgba(255,60,40,.10),rgba(0,0,0,0) 35%),#070504;box-shadow:0 20px 50px rgba(0,0,0,.6)}
:root[data-skin="oro"] .side::after{display:none}
:root[data-skin="oro"] .nav{border-radius:999px;padding:11px 16px}
:root[data-skin="oro"] .btn,:root[data-skin="oro"] .chip,:root[data-skin="oro"] .seg,:root[data-skin="oro"] .seg button{border-radius:999px}
:root[data-skin="oro"] .seg{padding:4px}
:root[data-skin="oro"] .box,:root[data-skin="oro"] .tbl,:root[data-skin="oro"] .ci-hit,:root[data-skin="oro"] .search,:root[data-skin="oro"] .input{background:var(--card)}
:root[data-skin="oro"] .box,:root[data-skin="oro"] .tbl{border-radius:20px}
:root[data-skin="oro"] .search{border-radius:999px;padding-left:24px}
:root[data-skin="oro"] .strip{background:none;border:0;gap:14px;overflow:visible}
:root[data-skin="oro"] .kpi{border-radius:20px;border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden;padding:20px 22px}
:root[data-skin="oro"] .kpi b{font-size:clamp(24px,2.3vw,34px)}
:root[data-skin="oro"] .kpi.hot{border-color:rgba(255,80,50,.45);box-shadow:0 14px 40px rgba(255,60,40,.18)}
:root[data-skin="oro"] .kpi.hot::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--fire)}
:root[data-skin="oro"] th{background:rgba(10,8,6,.96);text-transform:uppercase;letter-spacing:.07em;font-size:11px}
:root[data-skin="oro"] tr.click:hover td{background:rgba(255,201,60,.05)}
:root[data-skin="oro"] .row{border-top-color:rgba(255,196,64,.10)}
:root[data-skin="oro"] .sheet{border-radius:24px;background:linear-gradient(160deg,rgba(255,196,64,.06),rgba(0,0,0,0) 40%),#0b0907}
@media (max-width:860px){:root[data-skin="oro"] .app{grid-template-columns:96px minmax(0,1fr)}:root[data-skin="oro"] .nav{border-radius:16px;padding:10px 4px}}
@media (max-width:540px){:root[data-skin="oro"] .app{grid-template-columns:1fr}}
.eq-txt{font-size:18px;margin:0 0 22px;max-width:70ch}.eq-txt b{font-family:var(--display);font-stretch:115%;font-weight:800}
.eq-bar{position:relative;height:18px;border-radius:99px;background:var(--bar);margin:40px 0 0}
.eq-fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--fire,var(--grad))}
.eq-mark{position:absolute;top:-10px;bottom:-10px;width:3px;background:#fff;border-radius:2px;transform:translateX(-50%)}
.eq-mark span{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:800;color:#fff;background:#000;border:1px solid var(--line);padding:3px 8px;border-radius:99px}
.eq-you{position:absolute;top:100%;transform:translateX(-100%)}
.eq-you span{display:block;margin-top:8px;white-space:nowrap;font-size:12px;font-weight:700;color:var(--acc)}
.g-row{display:grid;grid-template-columns:auto minmax(0,1fr) 150px 34px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.g-row:first-of-type{border-top:0}
.g-n{min-width:0}.g-n b{font-weight:700}
.g-m{text-align:right;padding:9px 12px;font-weight:700}
.g-ok{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;width:82px}
.g-ok input{accent-color:#ffb800;width:18px;height:18px}
.g-add{border:1px dashed rgba(255,196,64,.4);border-radius:16px;padding:16px;margin-bottom:12px}
.g-rep{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}.g-rep input{accent-color:#ffb800;width:18px;height:18px}
.g-cat{margin-bottom:12px}.g-cat-h{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.g-cat-b{height:8px;border-radius:99px;background:rgba(255,255,255,.04)}.g-cat-b i{display:block;height:100%;border-radius:99px}
.g-mm{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.g-mm-b{display:flex;flex-direction:column;gap:3px}.g-mm-b i{display:block;height:7px;border-radius:99px}.g-mm-b .in{background:var(--fire,var(--grad))}.g-mm-b .out{background:var(--bar)}
.g-mm-n{font-weight:600}
@media (max-width:540px){.kpi b{font-size:20px!important;font-stretch:100%!important}.g-row{grid-template-columns:auto minmax(0,1fr) 34px}.g-m{grid-column:2/3}.eq-txt{font-size:16px}}
.g-subs{grid-column:2/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:2px}
.g-sub{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.g-sub .input{padding:8px 10px;text-align:right;font-weight:700}
.g-sum{text-align:right;font-weight:800;font-size:16px;padding:9px 12px}
@media (max-width:540px){.g-subs{grid-column:1/-1}}
/* menú compacto, sin barra de desplazamiento */

.side{scrollbar-width:none}.side::-webkit-scrollbar{display:none}
:root[data-skin="oro"] .side{padding:16px 12px;gap:2px}
:root[data-skin="oro"] .brand{padding:0 6px 10px;gap:10px}
:root[data-skin="oro"] .clock{padding:0 10px 12px;margin-bottom:6px}

:root[data-skin="oro"] .clock span{margin-top:3px;font-size:12px}
:root[data-skin="oro"] .nav{padding:8px 14px;font-size:14px;gap:11px}
:root[data-skin="oro"] .nav svg{width:18px;height:18px}
:root[data-skin="oro"] .side-foot{padding-top:10px}
@media (max-height:760px){:root[data-skin="oro"] .clock span{display:none}:root[data-skin="oro"] .clock b{font-size:22px}:root[data-skin="oro"] .nav{padding:6px 14px}:root[data-skin="oro"] .mark-img{width:40px}:root[data-skin="oro"] .brand{padding-bottom:6px}}
@media (max-height:640px){:root[data-skin="oro"] .clock{display:none}:root[data-skin="oro"] .nav{padding:5px 14px;font-size:13px}}
@media (max-width:860px){.mark-img{width:44px}}

   let dupMsg="";if(s&&cob.tr>0){const t=TRF.find(t=>t.estado==="pend"&&t.n===s.n&&t.monto===cob.tr);if(t){t.estado="manual";t.cob=cob;cob.linked=true;dupMsg=` · La transferencia de ${title(t.nombre)} quedó marcada como ya cobrada`}}
   if(s&&cu){const vencida=s.venc&&dias(s)<0,mode=C.venc==="auto"?(s.venc&&!vencida?"suyo":"hoy"):C.venc;s.venc=addD(mode==="suyo"&&s.venc?s.venc:fp,30);cob.vto=s.venc;if(!s.ult||fp>=s.ult)s.ult=fp}
   toast(`Cobro de ${ars(tot)} guardado a las ${hhmm(now)}${s&&cu?` · ${s.nom.split(" ")[0]} vence el ${fmt(s.venc)}`:""}${dupMsg}`);STATE.C=null;render(true)}}
 if(cur==="mp"){const T=id=>TRF.find(t=>t.id===+id);

  $$("[data-tno]").forEach(b=>b.onclick=()=>{const t=T(b.dataset.tno);t.n=null;t.por=null;render(true)});
  $$("[data-tsoc]").forEach(b=>b.onclick=()=>elegirSocio(T(b.dataset.tsoc)));
  $$("[data-tnew]").forEach(b=>b.onclick=()=>{const t=T(b.dataset.tnew);nuevo({nom:title(t.nombre),dni:t.cuil?dniDe(t.cuil):"",trf:t})});
  $$("[data-totro]").forEach(b=>b.onclick=()=>{const t=T(b.dataset.totro);cobrarTrf(t,null);toast("Marcada como \"No es del gym\": queda archivada y no suma en Facturación");render(true)});
  $("#tsim").onclick=()=>{const T0=new Date(),known=[...ALIAS.keys()];let e;const man=COB.find(c=>!c.imp&&!c.trf&&!c.linked&&c.n&&c.tr>0&&d0(c.f).getTime()===TODAY().getTime());
   if(man){const s=BYN.get(man.n);e={nombre:s.raw,cuil:s.dni?cuil(s.dni,s.gen==="Femenino"):null,origen:"Banco Galicia",monto:man.tr}}else
   if(known.length){const c=known[known.length-1],prev=TRF.find(t=>t.cuil===c);e={nombre:prev.nombre,cuil:c,origen:prev.origen,monto:prev.monto}}
   else{const s=SOC.find(x=>x.dni&&x.dni.length>=7&&est(x)==="late"&&!TRF.some(t=>t.n===x.n));e={nombre:s.raw,cuil:cuil(s.dni,s.gen==="Femenino"),origen:"Banco Macro",monto:47000}}
   const t={id:++TSEQ,...e,h:T0,estado:"pend",n:null,por:null};identificar(t);TRF.push(t);toast(`Nueva transferencia de ${title(t.nombre)} por ${ars(t.monto)}`);render(true)}}
 if(cur==="avisos"){const sel=STATE.avSel[STATE.av];
  $$("[data-at]").forEach(b=>b.onclick=()=>{STATE.av=b.dataset.at;render(true)});
  $$("[data-avi]").forEach(r=>r.onclick=()=>{const n=r.dataset.avi;sel.has(n)?sel.delete(n):sel.add(n);render(true)});
  $("#avall").onclick=e=>{e.stopPropagation();$$("[data-avi]").forEach(r=>e.target.checked?sel.add(r.dataset.avi):sel.delete(r.dataset.avi));render(true)};
  $("#avx").onclick=previewAv}
 $$("#main [data-edcob]").forEach(b=>b.onclick=e=>{e.stopPropagation();corregir(b.dataset.edcob)});
 if(cur==="fact"){$$("[data-per]").forEach(b=>b.onclick=()=>{STATE.per=b.dataset.per;render(true)});$("#expp").onclick=()=>{const{a,b,l}=periodo();descargar(`pagos_${l.replace(/[ ,\/]+/g,"_")}.xlsx`,"REGISTRO PAGOS",[["N° de socio","Nombre y apellido","Fecha de Pago","Hora","Monto","Efectivo","Transferencia","Método de Pago","Concepto","Mes Declarado","AÑO"],...COB.filter(c=>c.f>=a&&c.f<=b).sort((x,y)=>x.id-y.id).map(c=>{const s=BYN.get(c.n);return[c.n||"",s?s.raw:"VENTA MOSTRADOR",c.f,c.h?hhmm(c.h):"",c.ef+c.tr,c.ef,c.tr,c.ef&&c.tr?"MIXTO":c.ef?"EFECTIVO":c.tr?"TRANSFERENCIA":"PASE GRATIS",c.items.map(i=>i.n).join(" + "),MESES[c.f.getMonth()].toUpperCase(),c.f.getFullYear()]})],[10,32,12,8,10,10,12,15,24,12,6])}}
 if(cur==="gastos")bindGastos();
 if(cur==="ajustes")$("#gprec").onclick=()=>{const hoy=fmt(TODAY());
  $$("[data-pc]").forEach(i=>{const c=CUOTAS.find(x=>x.k===i.dataset.pc),v=+i.value.replace(/\D/g,"");if(v&&v!==c.p){PCAMB.unshift([hoy,c.n,ars(c.p)+" → "+ars(v)]);c.p=v}});
  $$("[data-pp]").forEach(i=>{const p=PRODS.find(x=>x.k===i.dataset.pp),v=+i.value.replace(/\D/g,"");if(v&&v!==p.p){PCAMB.unshift([hoy,p.n,ars(p.p)+" → "+ars(v)]);p.p=v}});
  render(true);toast("Precios guardados")};
}
(function(){const tp=document.createElement("div");tp.className="tip";tp.hidden=true;document.body.appendChild(tp);let on=null;
 const place=(x,y)=>{const r=tp.getBoundingClientRect(),W=innerWidth;let l=x+14,t=y-r.height-12;if(l+r.width>W-8)l=x-r.width-14;if(l<8)l=8;if(t<8)t=y+18;tp.style.left=l+"px";tp.style.top=t+"px"};
 const show=(el,x,y)=>{if(on)on.classList.remove("on");on=el;el.classList.add("on");tp.innerHTML=el.dataset.tip;tp.hidden=false;place(x,y)};
 const hide=()=>{tp.hidden=true;if(on)on.classList.remove("on");on=null};
 document.addEventListener("mousemove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)show(el,e.clientX,e.clientY);else if(on)hide()});
 document.addEventListener("click",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el){const r=el.getBoundingClientRect();show(el,r.left+r.width/2,r.top+20)}else hide()});
 addEventListener("scroll",hide,{passive:true})})();
const KEY="awg-estado-v1";
const rev=x=>x?new Date(x):null;
/* ---- sincronización con Supabase ---- */
const stable=v=>v===null||typeof v!=="object"?JSON.stringify(v):Array.isArray(v)?"["+v.map(x=>x===undefined?"null":stable(x)).join(",")+"]":"{"+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+stable(v[k])).join(",")+"}";
const plano=o=>JSON.parse(JSON.stringify(o));
let SNAP=new Map(),syncT=null,syncing=false,syncAgain=false;
function coleccion(){const m=new Map(),put=(col,id,data)=>{const d=plano(data);m.set(col+"|"+id,{col,id:String(id),data:d,j:stable(d)})};
 SOC.forEach(s=>put("soc",s.n,s));COB.forEach(c=>put("cob",c.id,{...c,cob:undefined}));INGRESOS.forEach(i=>put("ing",i.id,i));
 Object.entries(GMES).forEach(([mes,L])=>L.forEach(g=>put("gas",mes+"|"+g.id,{...g,mes})));
 put("cfg","cuotas",{v:CUOTAS});put("cfg","prods",{v:PRODS});put("cfg","pcamb",{v:PCAMB});put("cfg","gtpl",{v:GTPL});return m}
function estado(t){SYNC_TXT=t;const e=$("#sync");if(e)e.textContent=t}
async function sincronizar(){if(syncing){syncAgain=true;return}syncing=true;const sb=window.__sb;
 try{const cur=coleccion(),ups=[],dels=[];cur.forEach((v,k)=>{if(SNAP.get(k)!==v.j)ups.push(v)});SNAP.forEach((_,k)=>{if(!cur.has(k))dels.push(k)});
  if(!ups.length&&!dels.length){syncing=false;return}
  estado(ups.length>200?`Subiendo ${ups.length} registros…`:"Guardando…");
  for(let i=0;i<ups.length;i+=400){const lote=ups.slice(i,i+400);const{error}=await sb.from("registros").upsert(lote.map(v=>({col:v.col,id:v.id,data:v.data,updated_at:new Date().toISOString()})));if(error)throw error;lote.forEach(v=>SNAP.set(v.col+"|"+v.id,v.j))}
  for(const k of dels){const i=k.indexOf("|"),{error}=await sb.from("registros").delete().eq("col",k.slice(0,i)).eq("id",k.slice(i+1));if(error)throw error;SNAP.delete(k)}
  estado("✓ Guardado "+hhmm(new Date()))}
 catch(e){console.error(e);estado("⚠ Sin conexión · reintentando");setTimeout(programar,8000)}
 syncing=false;if(syncAgain){syncAgain=false;programar()}}
function programar(){clearTimeout(syncT);syncT=setTimeout(sincronizar,500)}
function hidratarDB(rows){rows.forEach(r=>SNAP.set(r.col+"|"+r.id,stable(r.data)));if(!rows.length)return;
 const by=c=>rows.filter(r=>r.col===c).map(r=>r.data);
 SOC.length=0;by("soc").forEach(s=>{s.nac=revD(s.nac);s.venc=revD(s.venc);s.ult=revD(s.ult);SOC.push(s)});SOC.sort((a,b)=>a.n.localeCompare(b.n));BYN.clear();SOC.forEach(s=>BYN.set(s.n,s));
 COB.length=0;by("cob").forEach(c=>{c.f=revD(c.f);c.h=rev(c.h);COB.push(c)});COB.sort((a,b)=>a.id-b.id);
 INGRESOS=by("ing").map(i=>({...i,t:new Date(i.t)})).sort((a,b)=>b.t-a.t);
 Object.keys(GMES).forEach(k=>delete GMES[k]);by("gas").forEach(g=>{const m=g.mes;delete g.mes;(GMES[m]=GMES[m]||[]).push(g)});
 const cf=Object.fromEntries(rows.filter(r=>r.col==="cfg").map(r=>[r.id,r.data.v]));
 if(cf.cuotas)CUOTAS.splice(0,CUOTAS.length,...cf.cuotas);if(cf.prods)PRODS.splice(0,PRODS.length,...cf.prods);if(cf.pcamb)PCAMB.splice(0,PCAMB.length,...cf.pcamb);if(cf.gtpl)GTPL.splice(0,GTPL.length,...cf.gtpl);
 // las filas de la base reemplazan al estado local: los snapshots quedan con el formato de la base
 coleccion().forEach((v,k)=>{if(SNAP.has(k))SNAP.set(k,v.j)})}
function aplicar(p){const r=p.new&&p.new.col?p.new:p.old;if(!r||!r.col)return;const k=r.col+"|"+r.id;
 if(p.eventType==="DELETE"){if(!SNAP.has(k))return;SNAP.delete(k);
  if(r.col==="soc"){const i=SOC.findIndex(s=>s.n===r.id);if(i>=0){SOC.splice(i,1);BYN.delete(r.id)}}
  else if(r.col==="cob"){const i=COB.findIndex(c=>String(c.id)===r.id);if(i>=0)COB.splice(i,1)}
  else if(r.col==="ing")INGRESOS=INGRESOS.filter(x=>String(x.id)!==r.id);
  else if(r.col==="gas"){const j=r.id.indexOf("|"),m=r.id.slice(0,j),id=r.id.slice(j+1);if(GMES[m])GMES[m]=GMES[m].filter(g=>String(g.id)!==id)}
  refrescar();return}
 const d=r.data,j=stable(d);if(SNAP.get(k)===j)return;SNAP.set(k,j);
 if(r.col==="soc"){d.nac=revD(d.nac);d.venc=revD(d.venc);d.ult=revD(d.ult);const s=BYN.get(r.id);if(s)Object.assign(s,d);else{SOC.push(d);BYN.set(d.n,d)}}
 else if(r.col==="cob"){d.f=revD(d.f);d.h=rev(d.h);const c=COB.find(x=>String(x.id)===r.id);if(c)Object.assign(c,d);else{COB.push(d);COB.sort((a,b)=>a.id-b.id)}}
 else if(r.col==="ing"){d.t=new Date(d.t);const i=INGRESOS.find(x=>String(x.id)===r.id);if(i)Object.assign(i,d);else{INGRESOS.push(d);INGRESOS.sort((a,b)=>b.t-a.t)}}
 else if(r.col==="gas"){const m=d.mes;delete d.mes;const L=GMES[m]=GMES[m]||[],g=L.find(x=>String(x.id)===String(d.id));if(g)Object.assign(g,d);else L.push(d)}
 else if(r.col==="cfg"){const A={cuotas:CUOTAS,prods:PRODS,pcamb:PCAMB,gtpl:GTPL}[r.id];if(A)A.splice(0,A.length,...d.v)}
 const v=coleccion().get(k);if(v)SNAP.set(k,v.j);refrescar()}
let refT=null;function refrescar(){clearTimeout(refT);refT=setTimeout(()=>{const a=document.activeElement;if($("#modal").innerHTML||(a&&/INPUT|TEXTAREA/.test(a.tagName))){refrescar();return}render(true)},400)}
function guardar(){if(window.__sb){programar();return}if(window.__vista)return;try{localStorage.setItem(KEY,JSON.stringify({base:DATA.pag.length+":"+DATA.soc.length,soc:SOC,cob:COB.map(c=>({...c,cob:undefined})),ing:INGRESOS,gm:GMES,gt:GTPL,cu:CUOTAS,pr:PRODS,pc:PCAMB,al:[...ALIAS],trf:TRF.map(t=>({...t,cob:t.cob?t.cob.id:null})),seq:SEQ,tseq:TSEQ,gid:GID}))}catch(e){}}
function cargar(){if(window.__vista)return false;let j;try{j=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return false}
 if(!j||j.base!==DATA.pag.length+":"+DATA.soc.length)return false;
 SOC.length=0;j.soc.forEach(s=>{s.nac=revD(s.nac);s.venc=revD(s.venc);s.ult=revD(s.ult);SOC.push(s)});BYN.clear();SOC.forEach(s=>BYN.set(s.n,s));
 COB.length=0;j.cob.forEach(c=>{c.f=revD(c.f);c.h=rev(c.h);COB.push(c)});INGRESOS=j.ing.map(i=>({...i,t:new Date(i.t)}));
 Object.keys(GMES).forEach(k=>delete GMES[k]);Object.assign(GMES,j.gm);GTPL.splice(0,GTPL.length,...j.gt);CUOTAS.splice(0,CUOTAS.length,...j.cu);PRODS.splice(0,PRODS.length,...j.pr);PCAMB.splice(0,PCAMB.length,...j.pc);
 ALIAS.clear();j.al.forEach(([k,v])=>ALIAS.set(k,v));TRF.length=0;j.trf.forEach(t=>{t.h=rev(t.h);if(t.cob)t.cob=COB.find(c=>c.id===t.cob);TRF.push(t)});
 SEQ=j.seq;TSEQ=j.tseq;GID=j.gid;return true}
document.documentElement.dataset.skin="oro";
if(window.__sb){hidratarDB(window.__rows||[]);window.__sb.channel("registros").on("postgres_changes",{event:"*",schema:"public",table:"registros"},aplicar).subscribe()}
else if(!cargar())seedTRF();
render();

}
