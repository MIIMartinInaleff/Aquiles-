<title>Mis Cuentas · José</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Piel "panel oscuro" (estilo tablero de métricas): casi negro, acento violeta, letra Geist grande. */
:root{
 --bg:#09090B;--card:#121215;--card2:#17171B;--ink:#F4F4F5;--muted:#A1A1AA;--line:#26262C;--soft:#1E1E23;
 --brand:#8B5CF6;--brand2:#7C4DEB;--glow:rgba(139,92,246,.18);
 --in:#16A47F;--out:#E5603A;--inT:#4ADE9F;--outT:#FF8F6B;--warn:#F5B83D;--ok:#16A47F;
 --r:14px;
}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Geist,system-ui,sans-serif;line-height:1.45;
 background-image:radial-gradient(900px 420px at 70% -120px,var(--glow),transparent 70%)}
h1,h2,h3{font-weight:700;letter-spacing:-.02em;margin:0}
h1{font-size:28px}h2{font-size:19px}h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
.wrap{max-width:1240px;width:100%;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 16px}
.hola{color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.g2,.g3{grid-template-columns:1fr}}
@media(max-width:560px){.g4{gap:10px}.kpi{padding:12px 12px 0}.kpi .big{font-size:21px}.kpi .sub{font-size:12.5px}.kpi svg{width:calc(100% + 24px);margin:8px -12px 0;height:40px}.kpi .delta{font-size:12px}}
.lbl{font-size:14px;color:var(--muted);font-weight:500;display:block;margin-bottom:6px}
.big{font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mid{font-weight:700;font-size:23px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.in{color:var(--inT)}.out{color:var(--outT)}.mut{color:var(--muted)}.sm{font-size:14px}
.stat{padding:16px 18px}
.stat .lbl{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
/* tarjeta de métrica con variación y minigráfico */
.kpi{padding:16px 18px 0;margin-bottom:0;display:flex;flex-direction:column;overflow:hidden}
.kpi .lbl{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.kpi .v{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kpi .sub{font-size:14px;color:var(--muted);margin-top:4px;min-height:20px}
.kpi svg{display:block;width:calc(100% + 36px);margin:10px -18px 0;height:58px}
.delta{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.delta.up{background:rgba(229,96,58,.16);color:var(--outT)}.delta.down{background:rgba(22,164,127,.16);color:var(--inT)}.delta.eq{background:var(--soft);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;background:var(--brand);color:#fff;font-weight:600;padding:12px 20px;cursor:pointer;min-height:48px;font-size:17px;text-decoration:none}
.btn:hover{background:var(--brand2)}
.btn.sec{background:var(--soft);color:var(--ink);border-color:var(--line)}.btn.sec:hover{background:#26262C}
.btn.red{background:var(--out)}.btn.green{background:var(--in)}.btn.green:hover{background:#13906F}
.btn.sm{min-height:38px;padding:7px 14px;font-size:15px}
.btn.full{width:100%}
.input{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:12px 14px;font-size:18px;outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--glow)}
select.input option{background:var(--card)}
.monto{font-size:36px;font-weight:700;text-align:center;padding:14px;letter-spacing:-.02em}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:42px;height:42px;border-radius:10px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:21px;flex:none}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;overflow-wrap:break-word;font-weight:600}
.row .tx small{color:var(--muted);font-size:14px}
.row .am{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.click{cursor:pointer;border-radius:8px}.row.click:hover{background:var(--card2)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 10px;font-weight:600;cursor:pointer;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.seg.tipo button{font-size:17px;padding:11px}
.seg.tipo button.on.g{background:var(--out);color:#fff}.seg.tipo button.on.i{background:var(--in);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:7px 12px;font-size:15px;font-weight:600;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}

.cat .e{font-size:28px;display:block;margin-bottom:4px}
.cat.on{border-color:var(--brand);background:rgba(139,92,246,.14);box-shadow:0 0 0 3px var(--glow)}
.mes{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.mes button{width:40px;height:40px;border-radius:8px;border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--muted)}
.mes button:hover{background:var(--soft);color:var(--ink)}

.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}

.hb{display:grid;grid-template-columns:160px 1fr auto;align-items:center;gap:10px;padding:7px 0}
.hb .t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;text-align:right;min-width:96px}
@media(max-width:520px){.hb{grid-template-columns:110px 1fr auto}.hb .v{min-width:80px;font-size:14px}}

.cols{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:10px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0 47px,rgba(255,255,255,.04) 47px 48px)}
.cols .c{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;cursor:default}
.cols .c:hover{background:rgba(255,255,255,.03)}
.cols .c i{display:block;width:min(20px,40%);border-radius:4px 4px 0 0;min-height:2px}
.xl{display:flex;gap:10px}.xl span{flex:1;text-align:center;font-size:13px;color:var(--muted);padding-top:6px}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700;background:var(--soft)}
.pill.ok{background:rgba(22,164,127,.16);color:var(--inT)}.pill.warn{background:rgba(245,184,61,.16);color:var(--warn)}.pill.bad{background:rgba(229,96,58,.16);color:var(--outT)}
.aviso{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(245,184,61,.08);border:1px solid rgba(245,184,61,.25);margin-bottom:10px}
.aviso.ok{background:rgba(22,164,127,.08);border-color:rgba(22,164,127,.3)}.aviso.bad{background:rgba(229,96,58,.08);border-color:rgba(229,96,58,.3)}
.aviso .e{font-size:22px}
.aviso .sm{color:var(--muted)}
/* desglose: de lo que entró a lo que quedó */
.desg .ln{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-top:0;font-variant-numeric:tabular-nums;font-size:15px}
.desg .ln:first-child{border-top:1px solid var(--line);border-radius:10px 10px 0 0}
.desg .ln:last-child{border-radius:0 0 10px 10px}
.desg .ln.h{background:var(--card2);font-weight:700}
.desg .ln span:first-child{color:var(--muted)}.desg .ln.h span:first-child{color:var(--ink)}
.desg .ln b{font-weight:700}
.layout{display:grid;grid-template-columns:1fr;gap:14px}
.layout .g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
@media(max-width:420px){.layout .g2{grid-template-columns:1fr}}
@media(min-width:1400px){.layout{grid-template-columns:minmax(0,1fr) 360px}.layout>aside{position:sticky;top:16px;align-self:start}}
.mas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mas button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:22px 12px;font-weight:600;font-size:17px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.mas button svg{width:28px;height:28px;color:var(--brand)}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mbar{position:fixed;left:0;right:0;bottom:0;background:rgba(18,18,21,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:30}
.mbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);padding:4px 8px;cursor:pointer;min-width:60px}
.mbar button .ico{width:24px;height:24px}
.mbar button.on{color:var(--ink)}.mbar button.on .ico{color:var(--brand)}
.mbar .plus{width:60px;height:60px;border-radius:18px;background:var(--brand);color:#fff;font-size:34px;display:grid;place-items:center;margin-top:-24px;box-shadow:0 8px 24px rgba(139,92,246,.45);padding:0}
@media(min-width:900px){
 .mbar{display:none}
 .shell{grid-template-columns:250px 1fr}
 .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;padding:18px 14px;background:var(--card);border-right:1px solid var(--line)}
 .side .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:4px 8px 18px}
 .side .logo i{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;font-style:normal;color:#fff;font-size:17px}
 .side .gt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 6px}
 .side button.it{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--muted);text-align:left;padding:10px;border-radius:8px;font-size:16px;font-weight:500;cursor:pointer}
 .side button.it:hover{background:var(--soft);color:var(--ink)}
 .side button.it.on{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
 .side button.it.on .ico{color:var(--brand)}
 .side .add{margin-top:auto}
 .wrap{padding:22px 28px 40px}
}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .box{background:var(--card);border:1px solid var(--line);width:min(620px,100%);max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:20px}}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:18px;cursor:pointer}
.f{margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 18px;border-radius:10px;font-weight:600;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc button{border:1px solid var(--line);border-radius:12px;background:var(--card2);font-size:23px;font-weight:600;padding:16px 0;cursor:pointer}
.calc button.op{background:var(--soft);color:#C4B5FD}.calc button.eq{background:var(--brand);color:#fff;border-color:var(--brand)}
.disp{background:#000;border:1px solid var(--line);border-radius:12px;padding:14px 18px;text-align:right;margin-bottom:10px}
.disp .h{font-size:15px;color:var(--muted);min-height:22px}.disp .r{font-size:38px;font-weight:700;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.res{background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.3);border-radius:12px;padding:14px 16px;margin-top:12px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.t th{color:var(--muted);font-weight:500}
table.t td:first-child,table.t th:first-child{text-align:left}
.chk{width:26px;height:26px;accent-color:var(--in);flex:none}
.empty{text-align:center;color:var(--muted);padding:24px 10px}
details summary{color:var(--muted)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="shell">
 <aside class="side" id="nav"></aside>
 <div class="wrap">
  <div class="top"><div><div class="hola" id="hola"></div><h1 id="tit">Mis Cuentas</h1></div><div id="topr"></div></div>
  <main id="main"></main>
 </div>
</div>
<nav class="mbar" id="mbar"></nav>

<script>
/* ===== Datos =====
   Todo se guarda en este dispositivo (localStorage, clave "jose_v1"). Nada se sube al repo.
   Copia de seguridad: Ajustes → Guardar copia / Recuperar copia. */
const KEY="jose_v1";
const CATS_G=[["super","🛒","Supermercado"],["casa","💡","Luz, gas, agua"],["internet","📶","Internet y celular"],["auto","⛽","Auto y nafta"],["salud","💊","Salud"],["comida","🍽️","Comida afuera"],["tarjeta","💳","Tarjeta"],["prestamo","🏦","Préstamos y planes"],["dpto","🏢","Depto Bs As"],["impuestos","🧾","Impuestos"],["familia","👨‍👩‍👦","Hijos y familia"],["legal","⚖️","Abogados"],["negocio","🏫","Instituto y gym"],["ropa","👕","Ropa"],["casa2","🛠️","Arreglos casa"],["ocio","🎉","Salidas"],["mascota","🐶","Mascotas"],["otros","📦","Otros"]];
const CATS_I=[["gym","🏋️","Gimnasio"],["sueldo","💼","Sueldo / jubilación"],["extra","➕","Extras"],["otros_i","💵","Otros"]];
const MEDIOS=["Efectivo","Débito","Crédito","Mercado Pago","Transferencia"];
const CAT={};CATS_G.concat(CATS_I).forEach(c=>CAT[c[0]]={e:c[1],n:c[2]});
const cn=k=>(CAT[k]||CAT.otros).n,ce=k=>(CAT[k]||CAT.otros).e;
let DB;
function cargar(){try{DB=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){DB=null}
 if(!DB)DB={nombre:"José",mov:[],fijos:[],pres:{},pagos:{},mpIgn:{},deudas:[]};
 cargarDefaults()}
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast("⚠ No se pudo guardar")}}
cargar();
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ===== Formato ===== */
const ars=n=>{n=Math.round(+n||0);const s=Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");return(n<0?"-$":"$")+s};
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const MC=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const p2=n=>(n<10?"0":"")+n;
const hoyS=()=>{const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
const mesDe=f=>f.slice(0,7);
const mesHoy=()=>hoyS().slice(0,7);
const mesN=m=>{const[y,mm]=m.split("-");return MESES[mm-1]+" "+y};
const mesC=m=>MC[+m.slice(5)-1];
const mesMas=(m,k)=>{let[y,mm]=m.split("-").map(Number);mm+=k;while(mm<1){mm+=12;y--}while(mm>12){mm-=12;y++}return y+"-"+p2(mm)};
const fCorta=f=>+f.slice(8)+" "+MC[+f.slice(5,7)-1];
const diasMes=m=>new Date(+m.slice(0,4),+m.slice(5),0).getDate();
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=s=>{s=String(s||"").replace(/[^\d,.-]/g,"");if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/[.,]/g,"");return +s||0};
const pct=(a,b)=>b?Math.round(a/b*100):0;

/* ===== Cálculos ===== */
const movMes=m=>DB.mov.filter(x=>mesDe(x.f)===m);
/* lo que entra = lo que cobra el gym (Facturación del sistema del gym), salvo que ese mes se haya cargado a mano un ingreso "Gimnasio" */
const gymMes=m=>movMes(m).some(x=>x.t==="i"&&x.cat==="gym")?0:Math.round((DB.gym||{})[m]||0);
function tot(m){let g=0,i=gymMes(m);movMes(m).forEach(x=>x.t==="i"?i+=x.m:g+=x.m);return{g,i,q:i-g,gym:gymMes(m)}}
function porCat(m){const r={};movMes(m).filter(x=>x.t==="g").forEach(x=>r[x.cat]=(r[x.cat]||0)+x.m);return Object.entries(r).sort((a,b)=>b[1]-a[1])}
function fijosMes(m){return DB.fijos.filter(f=>!f.hasta||m<=f.hasta).map(f=>({...f,pag:(DB.pagos[m]||{})[f.id]}))}
const totDeuda=()=>DB.deudas.reduce((a,d)=>a+d.m,0);

/* ===== Estado de pantalla ===== */
const S={sec:"inicio",mes:mesHoy(),q:"",filtro:"todo",calc:"cuotas"};
const SECS=[["inicio","🏠","Inicio"],["movs","📋","Movimientos"],["metricas","📊","Métricas"],["fijos","📅","Gastos fijos"],["calc","🧮","Calculadora"],["mp","💙","Mercado Pago"],["ajustes","⚙️","Ajustes"]];
const ICO={inicio:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
 movs:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
 metricas:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/>',fijos:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8.5 15l2 2 4-4"/>',

let spk=0;
function spark(vals,color,tips){const n=vals.length,mx=Math.max(1,...vals),pts=vals.map((v,i)=>[n>1?i/(n-1)*100:50,36-v/mx*30]);const id="sp"+(++spk);
 return`<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
 <path d="M0,40 L${pts.map(p=>p.join(",")).join(" L")} L100,40Z" fill="url(#${id})"/><polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>
 ${pts.map((p,i)=>`<rect x="${p[0]-100/n/2}" y="0" width="${100/n}" height="40" fill="transparent" data-tip="${esc(tips[i])}"/>`).join("")}</svg>`}
function delta(a,b,malo){if(!b)return"";const d=Math.round((a-b)/b*100);const cls=d===0?"eq":(d>0)===malo?"up":"down";return`<span class="delta ${cls}">${d>0?"+":""}${d}%</span>`}
const V={};

function selMes(){return`<div class="mes"><button data-mes="-1" aria-label="Mes anterior">‹</button><b>${mesN(S.mes)}</b><button data-mes="1" aria-label="Mes siguiente">›</button></div>`}

/* ----- Inicio ----- */
V.inicio=()=>{
 const m=S.mes,t=tot(m),ant=tot(mesMas(m,-1)),pc=porCat(m).slice(0,5),hoy=mesHoy();
 const fx=fijosMes(m),pend=fx.filter(f=>!f.pag),dHoy=+hoyS().slice(8);
 const avisos=[];
 if(m===hoy){
  const vencen=pend.filter(f=>f.dia&&f.dia-dHoy<=5).sort((a,b)=>a.dia-b.dia);
  if(vencen.length>2)avisos.push(`<div class="aviso bad"><span class="e">⏰</span><div><b>${vencen.length} fijos por vencer o vencidos · ${ars(vencen.reduce((a,f)=>a+f.m,0))}</b><div class="sm">${vencen.map(f=>esc(f.nom)+" (día "+f.dia+")").join(", ")}</div></div><button class="btn sm" data-ir="fijos" style="margin-left:auto">Ver</button></div>`);
  else vencen.forEach(f=>avisos.push(`<div class="aviso ${f.dia<dHoy?"bad":""}"><span class="e">${f.dia<dHoy?"⏰":"📅"}</span><div><b>${esc(f.nom)} · ${ars(f.m)}</b><div class="sm">${f.dia<dHoy?"Venció el día "+f.dia:f.dia===dHoy?"Vence hoy":"Vence el día "+f.dia}</div></div><button class="btn sm green" data-pagar="${f.id}" style="margin-left:auto">Pagado</button></div>`));
  if(t.i&&t.g>t.i)avisos.push(`<div class="aviso bad"><span class="e">⚠️</span><div><b>Este mes salió más de lo que entró</b><div class="sm">Gastaste ${ars(t.g-t.i)} de más.</div></div></div>`);
  Object.entries(DB.pres).forEach(([c,p])=>{if(!p)return;const g=(pc.find(x=>x[0]===c)||porCat(m).find(x=>x[0]===c)||[0,0])[1];
   if(g>=p)avisos.push(`<div class="aviso bad"><span class="e">${ce(c)}</span><div><b>${cn(c)}: te pasaste del tope</b><div class="sm">Llevás ${ars(g)} de ${ars(p)}.</div></div></div>`);
   else if(g>=p*.8)avisos.push(`<div class="aviso"><span class="e">${ce(c)}</span><div><b>${cn(c)}: cerca del tope</b><div class="sm">Llevás ${ars(g)} de ${ars(p)} (${pct(g,p)}%).</div></div></div>`)});
 }
 if(DB.deudas.length)avisos.unshift(`<div class="aviso bad"><span class="e">🔴</span><div><b>Tenés ${DB.deudas.length} ${DB.deudas.length>1?"cosas":"cosa"} sin pagar: ${ars(totDeuda())}</b><div class="sm">${DB.deudas.map(d=>esc(d.nom)).join(", ")}</div></div><button class="btn sm" data-ir="fijos" style="margin-left:auto">Ver</button></div>`);
 const ult=DB.mov.slice().sort((a,b)=>b.f.localeCompare(a.f)||b.id.localeCompare(a.id)).slice(0,6);
 const proyec=m===hoy&&dHoy>3?Math.round(t.g/dHoy*diasMes(m)):null;
 const M6=[];for(let k=5;k>=0;k--){const x=mesMas(m,-k);M6.push({m:x,...tot(x)})}
 const tp=k=>M6.map(x=>mesN(x.m)+": "+ars(x[k]));
 const falta=pend.reduce((a,f)=>a+f.m,0)+totDeuda(),mAnt=MESES[+mesMas(m,-1).slice(5)-1].toLowerCase();
 const todas=porCat(m);
 return`
 <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">${selMes()}<button class="btn" data-nuevo="g">＋ Cargar gasto</button></div>
 <div class="grid g4" style="margin-bottom:14px">
  <div class="card kpi"><span class="lbl"><i class="dot" style="background:var(--in)"></i>Entró</span><div class="v"><span class="big">${ars(t.i)}</span>${delta(t.i,ant.i,false)}</div><div class="sub">${t.i?(t.gym?"del gym · ":"")+"contra "+ars(ant.i)+" en "+mAnt:"Lo que cobra el gym"}</div>${spark(M6.map(x=>x.i),"#16A47F",tp("i"))}</div>
  <div class="card kpi"><span class="lbl"><i class="dot" style="background:var(--out)"></i>Gasté</span><div class="v"><span class="big">${ars(t.g)}</span>${delta(t.g,ant.g,true)}</div><div class="sub">contra ${ars(ant.g)} en ${mAnt}</div>${spark(M6.map(x=>x.g),"#E5603A",tp("g"))}</div>
  <div class="card kpi"><span class="lbl"><i class="dot" style="background:var(--brand)"></i>Me quedó</span><div class="v"><span class="big ${t.q<0?"out":""}">${ars(t.q)}</span></div><div class="sub">${t.i?"Ahorré el "+Math.max(0,pct(t.q,t.i))+"% de lo que entró":"Falta cargar lo que entra"}</div>${spark(M6.map(x=>Math.max(0,x.q)),"#8B5CF6",tp("q"))}</div>
  <div class="card kpi"><span class="lbl"><i class="dot" style="background:var(--warn)"></i>Falta pagar</span><div class="v"><span class="big">${ars(falta)}</span></div><div class="sub">${pend.length} fijos del mes${DB.deudas.length?" + "+DB.deudas.length+" atrasados":""}</div><div style="padding:10px 0 16px"><button class="btn sec sm full" data-ir="fijos">Ver qué falta</button></div></div>
 </div>
 <div class="layout"><div>
 ${!t.i&&t.g?`<div class="aviso"><span class="e">🏋️</span><div><b>Falta lo que entró del gym</b><div class="sm">${location.protocol==="file:"?"Se completa solo cuando la plataforma esté publicada (lee la Facturación del sistema del gym).":GYM.estado==="cargando"?"Trayendo lo cobrado en el gym…":"Para traerlo solo, entrá una vez al sistema del gym en esta compu o celu. O cargalo a mano."}</div></div><button class="btn sm green" data-nuevo="i" style="margin-left:auto">Cargar a mano</button></div>`:""}
 ${avisos.join("")}
 ${t.i?`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>De cada $100 que entraron, gasté $${Math.min(999,pct(t.g,t.i))}</b></div><div class="bar"><i style="width:${Math.min(100,pct(t.g,t.i))}%;background:${t.g>t.i?"var(--out)":t.g>t.i*.85?"var(--warn)":"var(--in)"}"></i></div>${proyec?`<div class="sm mut" style="margin-top:8px">A este ritmo, a fin de mes vas a gastar unos <b>${ars(proyec)}</b>.</div>`:""}</div>`:""}
 <div class="grid g2">
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h2>En qué se fue</h2><button class="btn sec sm" data-ir="metricas">Ver más</button></div>
   ${pc.length?pc.map(([c,v])=>hb(ce(c)+" "+cn(c),v,pc[0][1],"var(--out)")).join(""):`<div class="empty">Todavía no cargaste gastos este mes.</div>`}</div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h2>Fijos del mes</h2><button class="btn sec sm" data-ir="fijos">Ver</button></div>
   ${fx.length?`<div class="sm mut" style="margin-bottom:6px">Pagaste ${fx.length-pend.length} de ${fx.length} · faltan ${ars(pend.reduce((a,f)=>a+f.m,0))}</div>`+fx.slice().sort((a,b)=>!!a.pag-!!b.pag||(a.dia||99)-(b.dia||99)).slice(0,5).map(filaFijo).join(""):`<div class="empty">Anotá tus gastos fijos (luz, gas, internet…) para que te avise cuando vencen.<br><br><button class="btn sm" data-ir="fijos">Anotar gastos fijos</button></div>`}</div>
 </div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h2>Últimos movimientos</h2><button class="btn sec sm" data-ir="movs">Ver todos</button></div>
  ${ult.length?ult.map(filaMov).join(""):`<div class="empty">Tocá <b>＋</b> para cargar tu primer gasto.<br><br>¿Tenés una copia guardada? <button class="btn sec sm" data-ir="ajustes">📂 Recuperar copia</button></div>`}</div>
 </div>
 <aside><div class="card"><h2 style="margin-bottom:4px">Desglose</h2><p class="sm mut" style="margin:0 0 12px">De lo que entró a lo que te quedó en ${MESES[+m.slice(5)-1].toLowerCase()}.</p>
  <div class="desg"><div class="ln h"><span>Entró${t.gym&&t.gym===t.i?" (gym)":""}</span><b class="in">${ars(t.i)}</b></div>${t.gym&&t.gym!==t.i?`<div class="ln"><span>🏋️ Gym</span><b>${ars(t.gym)}</b></div><div class="ln"><span>Otros ingresos</span><b>${ars(t.i-t.gym)}</b></div>`:""}
  ${todas.map(([c,v])=>`<div class="ln"><span>${ce(c)} ${cn(c)}</span><b>-${ars(v).replace("-","")}</b></div>`).join("")}
  <div class="ln h"><span>Me quedó</span><b class="${t.q<0?"out":"in"}">${ars(t.q)}</b></div></div>
  ${DB.deudas.length?`<div class="sm mut" style="margin-top:12px">Además tenés <b class="out">${ars(totDeuda())}</b> sin pagar de meses anteriores.</div>`:""}</div></aside>
 </div>`};

function hb(t,v,max,color,tipT){return`<div class="hb" data-tip="${esc(tipT||t+": "+ars(v))}"><span class="t">${esc(t)}</span><div class="bar"><i style="width:${max?Math.max(2,v/max*100):0}%;background:${color}"></i></div><span class="v">${ars(v)}</span></div>`}
function filaMov(x){return`<div class="row click" data-mov="${x.id}"><div class="ic">${ce(x.cat)}</div><div class="tx"><b>${esc(x.det||cn(x.cat))}</b><small>${fCorta(x.f)} · ${cn(x.cat)}${x.medio?" · "+esc(x.medio):""}</small></div><div class="am ${x.t==="i"?"in":"out"}">${x.t==="i"?"+":"-"}${ars(x.m).replace("-","")}</div></div>`}
function filaFijo(f){return`<div class="row"><input type="checkbox" class="chk" data-fijo="${f.id}" ${f.pag?"checked":""} aria-label="Pagado"><div class="ic">${ce(f.cat)}</div><div class="tx"><b>${esc(f.nom)}</b><small>${f.dia?"Vence el "+f.dia:"Sin día fijo"}${f.hasta?" · Última cuota "+mesC(f.hasta).toLowerCase()+" "+f.hasta.slice(0,4):""}${f.pag?" · <span class='pill ok'>Pagado</span>":""}</small></div><div class="am">${ars(f.m)}</div></div>`}

/* ----- Movimientos ----- */
V.movs=()=>{
 const q=S.q.toLowerCase();
 let L=movMes(S.mes).filter(x=>(S.filtro==="todo"||x.t===S.filtro)&&(!q||(x.det+" "+cn(x.cat)+" "+(x.medio||"")).toLowerCase().includes(q))).sort((a,b)=>b.f.localeCompare(a.f)||b.id.localeCompare(a.id));
 const t=tot(S.mes);let html="",dia="";
 L.forEach(x=>{if(x.f!==dia){dia=x.f;html+=`<div class="lbl" style="margin:14px 0 0">${fCorta(x.f)}</div>`}html+=filaMov(x)});
 return`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">${selMes()}<button class="btn" data-nuevo="g">＋ Cargar</button></div>
 <div class="card"><input class="input" id="q" placeholder="🔍 Buscar (ej: nafta, farmacia)" value="${esc(S.q)}">
 <div class="seg" style="margin-top:10px">${[["todo","Todo"],["g","Gastos · "+ars(t.g)],["i","Ingresos · "+ars(t.i)]].map(([k,n])=>`<button data-filtro="${k}" class="${S.filtro===k?"on":""}">${n}</button>`).join("")}</div></div>
 <div class="card">${html||`<div class="empty">No hay movimientos en ${mesN(S.mes)}.</div>`}</div>`};

/* ----- Métricas ----- */
V.metricas=()=>{
 const m=S.mes,meses=[],nm=S.rango||6;for(let k=nm-1;k>=0;k--)meses.push(mesMas(m,-k));
 const T=meses.map(x=>({m:x,...tot(x)})),max=Math.max(1,...T.map(x=>Math.max(x.i,x.g)));
 const conG=T.filter(x=>x.g),prom=conG.length?Math.round(conG.reduce((a,x)=>a+x.g,0)/conG.length):0;
 const t=tot(m),pc=porCat(m),G=movMes(m).filter(x=>x.t==="g");
 const dias=m===mesHoy()?+hoyS().slice(8):diasMes(m);
 const chicos=G.filter(x=>x.m<=10000),mayor=G.slice().sort((a,b)=>b.m-a.m)[0];
 const sem=[0,0,0,0,0,0,0];G.filter(x=>!x.xls).forEach(x=>{const d=new Date(x.f+"T12:00");sem[d.getDay()]+=x.m});
 const DS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"],dmax=sem.indexOf(Math.max(...sem));
 const medios={};G.forEach(x=>{const k=x.medio||"Sin dato";medios[k]=(medios[k]||0)+x.m});const ML=Object.entries(medios).filter(x=>x[0]!=="Sin dato").sort((a,b)=>b[1]-a[1]);
 const ant=porCat(mesMas(m,-1)),antM=Object.fromEntries(ant);
 const subas=pc.map(([c,v])=>[c,v,v-(antM[c]||0)]).filter(x=>antM[x[0]]&&x[2]>0).sort((a,b)=>b[2]-a[2]).slice(0,3);
 return`<div style="margin-bottom:14px">${selMes()}</div>
 <div class="grid g3">
  <div class="card stat"><span class="lbl">Gasto por día</span><div class="mid">${ars(t.g/Math.max(1,dias))}</div><div class="sm mut">promedio en ${mesN(m).split(" ")[0].toLowerCase()}</div></div>
  <div class="card stat"><span class="lbl">Promedio mensual</span><div class="mid">${ars(prom)}</div><div class="sm mut">de gastos (${conG.length||0} meses con datos)</div></div>
  <div class="card stat"><span class="lbl">Gastos chicos</span><div class="mid">${ars(chicos.reduce((a,x)=>a+x.m,0))}</div><div class="sm mut">${chicos.length} gastos de menos de $10.000 (los "gastos hormiga")</div></div>
 </div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px"><h2>Entró y salió</h2><div class="seg" style="min-width:220px">${[[6,"6 meses"],[12,"12 meses"]].map(([k,n])=>`<button data-rango="${k}" class="${nm===k?"on":""}">${n}</button>`).join("")}</div></div>
  <div class="legend"><span><i class="dot" style="background:var(--in)"></i>Entró</span><span><i class="dot" style="background:var(--out)"></i>Gasté</span></div>
  <div class="cols">${T.map(x=>`<div class="c" data-tip="${mesN(x.m)} · Entró ${ars(x.i)} · Gasté ${ars(x.g)} · Quedó ${ars(x.q)}"><i style="height:${x.i/max*100}%;background:var(--in)"></i><i style="height:${x.g/max*100}%;background:var(--out)"></i></div>`).join("")}</div>
  <div class="xl">${T.map(x=>`<span>${mesC(x.m)}</span>`).join("")}</div>
  <details style="margin-top:12px"><summary class="sm mut" style="cursor:pointer">Ver en tabla</summary><table class="t" style="margin-top:8px"><tr><th>Mes</th><th>Entró</th><th>Gasté</th><th>Quedó</th></tr>${T.map(x=>`<tr><td>${mesN(x.m)}</td><td>${ars(x.i)}</td><td>${ars(x.g)}</td><td class="${x.q<0?"out":""}">${ars(x.q)}</td></tr>`).join("")}</table></details>
 </div>
 <div class="grid g2">
  <div class="card"><h2 style="margin-bottom:8px">Por categoría</h2>${pc.length?pc.map(([c,v])=>hb(ce(c)+" "+cn(c),v,pc[0][1],"var(--out)",cn(c)+": "+ars(v)+" ("+pct(v,t.g)+"% del total)")).join(""):`<div class="empty">Sin gastos este mes.</div>`}</div>
  <div class="card"><h2 style="margin-bottom:8px">Cómo pagué</h2>${ML.length?ML.map(([k,v])=>hb(k,v,ML[0][1],"var(--brand)")).join(""):`<div class="empty">Cuando cargues gastos con el medio de pago (efectivo, débito, tarjeta…) acá vas a ver cómo pagás.</div>`}</div>
 </div>
 ${(()=>{const L=DB.fijos.filter(f=>f.hasta&&f.hasta>=mesHoy()).sort((a,b)=>a.hasta.localeCompare(b.hasta));if(!L.length)return"";let acu=0;
  return`<div class="card"><h2 style="margin-bottom:4px">Cuándo se libera plata</h2><p class="mut sm" style="margin-top:0">Cuotas que terminan y cuánto te queda libre por mes después.</p>${L.map(f=>{acu+=f.m;return`<div class="row"><div class="ic">${ce(f.cat)}</div><div class="tx"><b>${esc(f.nom)}</b><small>Última cuota: ${mesN(f.hasta).toLowerCase()}${f.nota?" · "+esc(f.nota):""}</small></div><div style="text-align:right"><div class="am in">+${ars(f.m)}</div><small class="mut">por mes desde ${mesC(mesMas(f.hasta,1)).toLowerCase()}</small></div></div>`}).join("")}${L.length>1?`<div class="res"><b>Cuando terminen todas, te quedan ${ars(acu)} más por mes.</b></div>`:""}</div>`})()}
 <div class="card"><h2 style="margin-bottom:10px">Para tener en cuenta</h2>
  ${mayor?`<div class="row"><div class="ic">💸</div><div class="tx"><b>El gasto más grande: ${esc(mayor.det||cn(mayor.cat))}</b><small>${fCorta(mayor.f)} · ${pct(mayor.m,t.g)}% de todo lo del mes</small></div><div class="am out">${ars(mayor.m)}</div></div>`:""}
  ${sem.some(v=>v)?`<div class="row"><div class="ic">📆</div><div class="tx"><b>El día que más gastás: ${DS[dmax]}</b><small>Sumando todos los ${DS[dmax].toLowerCase()} del mes</small></div><div class="am">${ars(sem[dmax])}</div></div>`:""}
  ${subas.map(([c,v,d])=>`<div class="row"><div class="ic">${ce(c)}</div><div class="tx"><b>${cn(c)} subió</b><small>${ars(v)} contra ${ars(antM[c])} el mes anterior</small></div><div class="am out">+${ars(d).replace("-","")}</div></div>`).join("")}
  ${t.i?`<div class="row"><div class="ic">🐷</div><div class="tx"><b>Ahorro del mes</b><small>${t.q>=0?"Bien: te quedó plata.":"Este mes gastaste más de lo que entró."}</small></div><div class="am ${t.q<0?"out":"in"}">${pct(t.q,t.i)}%</div></div>`:""}
  ${!G.length?`<div class="empty">Cuando cargues gastos acá vas a ver consejos.</div>`:""}
 </div>`};

/* ----- Gastos fijos ----- */

V.calc=()=>{const tabs=[["cuotas","💳 Cuotas o contado"],["comun","🧮 Común"],["anual","📆 Cuánto sale al año"],["desc","🏷️ Descuentos"],["nafta","⛽ Nafta del viaje"]];

 cuotas:`<p class="mut sm" style="margin-top:0">¿Conviene pagar en cuotas o de contado? Las cuotas pierden valor con la inflación.</p>
  <div class="grid g2"><div class="f"><label class="lbl">Precio de contado</label><input class="input k" id="c1" inputmode="numeric" placeholder="$"></div>

 anual:`<p class="mut sm" style="margin-top:0">Un gasto chico que se repite, ¿cuánto suma en el año?</p>
  <div class="grid g2"><div class="f"><label class="lbl">Cuánto sale cada vez</label><input class="input k" id="a1" inputmode="numeric" placeholder="$"></div>
  <div class="f"><label class="lbl">Cada cuánto</label><select class="input k" id="a2"><option value="365">Todos los días</option><option value="260">Días de semana</option><option value="52" selected>Una vez por semana</option><option value="104">Dos veces por semana</option><option value="12">Una vez por mes</option></select></div></div><div id="ares"></div>`,
 desc:`<div class="grid g2"><div class="f"><label class="lbl">Precio</label><input class="input k" id="d1" inputmode="numeric" placeholder="$"></div>
  <div class="f"><label class="lbl">Porcentaje (%)</label><input class="input k" id="d2" inputmode="decimal" placeholder="Ej: 15"></div></div><div id="dres"></div>`,
 nafta:`<div class="grid g2"><div class="f"><label class="lbl">Kilómetros del viaje</label><input class="input k" id="n1" inputmode="numeric" placeholder="Ej: 400"></div>
  <div class="f"><label class="lbl">Ida y vuelta</label><select class="input k" id="n4"><option value="2">Sí</option><option value="1">No, solo ida</option></select></div>
  <div class="f"><label class="lbl">Litros cada 100 km</label><input class="input k" id="n2" inputmode="decimal" value="8"></div>
  <div class="f"><label class="lbl">Precio del litro</label><input class="input k" id="n3" inputmode="numeric" placeholder="$"></div></div><div id="nres"></div>`};
 return`<div class="seg" style="flex-wrap:wrap;border-radius:20px;margin-bottom:14px">${tabs.map(([k,n])=>`<button data-calc="${k}" class="${S.calc===k?"on":""}" style="flex:1 1 auto">${n}</button>`).join("")}</div><div class="card">${body[S.calc]}</div>`};

function calcular(){const g=id=>{const e=document.getElementById(id);return e?num(e.value):0},gd=id=>{const e=document.getElementById(id);return e?parseFloat(String(e.value).replace(",","."))||0:0},set=(id,h)=>{const e=document.getElementById(id);if(e)e.innerHTML=h};
 if(S.calc==="cuotas"){const c=g("c1"),tc=g("c2")||c,n=Math.max(1,g("c3")),inf=gd("c4")/100;if(!c)return set("cres","");
  const cuota=tc/n;let vp=0;for(let k=0;k<n;k++)vp+=cuota/Math.pow(1+inf,k);
  const ok=vp<c,rec=pct(tc-c,c);
  set("cres",`<div class="res"><div class="sm">Cada cuota: <b>${ars(cuota)}</b>${tc>c?` · Recargo: <b>${rec}%</b>`:""}</div><div class="mid" style="margin:6px 0">${ok?"✅ Conviene en cuotas":"💵 Conviene de contado"}</div><div class="sm">Con ${(inf*100).toFixed(1).replace(".",",")}% de inflación por mes, las cuotas "valen hoy" ${ars(vp)} contra ${ars(c)} de contado. ${ok?"Ahorrás "+ars(c-vp)+".":"Pagás "+ars(vp-c)+" de más."}</div></div>`)}
 if(S.calc==="anual"){const a=g("a1"),f=+document.getElementById("a2").value;if(!a)return set("ares","");
  set("ares",`<div class="res"><div class="sm">En un mes: <b>${ars(a*f/12)}</b></div><div class="mid" style="margin:6px 0">En un año: ${ars(a*f)}</div></div>`)}
 if(S.calc==="desc"){const p=g("d1"),d=gd("d2");if(!p||!d)return set("dres","");
  set("dres",`<div class="res"><div class="sm">Con ${d}% de descuento pagás</div><div class="mid">${ars(p*(1-d/100))}</div><div class="sm">Ahorrás ${ars(p*d/100)} · Con ${d}% de recargo serían ${ars(p*(1+d/100))}</div></div>`)}
 if(S.calc==="nafta"){const km=g("n1")*(+document.getElementById("n4").value),l=gd("n2"),pr=g("n3");if(!km||!l||!pr)return set("nres","");
  const lt=km*l/100;set("nres",`<div class="res"><div class="sm">${km} km · ${lt.toFixed(1).replace(".",",")} litros</div><div class="mid">${ars(lt*pr)}</div></div>`)}}

let CX={exp:"",ult:false};
function tecla(k){let e=CX.exp;
 if(k==="C"){CX={exp:"",ult:false};}
 else if(k==="←"){CX.exp=e.slice(0,-1)}
 else if(k==="="){try{const r=evalCalc(e);document.getElementById("ch").textContent=e+" =";CX={exp:fmtNum(r),ult:true};document.getElementById("cr").textContent=CX.exp;return}catch(x){CX.exp="";}}
 else{if(CX.ult&&/[\d,]/.test(k))e="";CX.ult=false;CX.exp=e+k}
 document.getElementById("ch").textContent="";document.getElementById("cr").textContent=CX.exp||"0"}
function evalCalc(e){const s=e.replace(/\./g,"").replace(/,/g,".").replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/(\d+(?:\.\d+)?)%/g,"($1/100)");
 if(!/^[\d+\-*/().\s]+$/.test(s))throw 0;const r=Function('"use strict";return('+s+')')();if(!isFinite(r))throw 0;return r}
function fmtNum(r){const[a,b]=(Math.round(r*100)/100).toString().split(".");return a.replace(/\B(?=(\d{3})+(?!\d))/g,".")+(b?","+b:"")}

  const por={};for(let i=0;;i+=1000){const q=await SBC.from("registros").select("data").eq("col","cob").range(i,i+999);if(q.error)throw q.error;
   q.data.forEach(r=>{const c=r.data||{},f=String(c.f||"").slice(0,7),v=(+c.ef||0)+(+c.tr||0);if(f&&v)por[f]=(por[f]||0)+v});if(q.data.length<1000)break}

 const jm=document.getElementById("jm");jm.oninput=()=>{const v=num(jm.value);jm.value=v?ars(v):""};
 document.getElementById("jok").onclick=()=>{f.nom=document.getElementById("jn").value.trim();f.m=num(jm.value);f.dia=Math.min(31,parseInt(document.getElementById("jd").value)||0);f.cat=document.getElementById("jc").value;f.hasta=document.getElementById("jh").value;f.nota=document.getElementById("jt").value.trim();
  if(!f.nom)return toast("Poné un nombre");if(f.id)Object.assign(DB.fijos.find(y=>y.id===f.id),f);else DB.fijos.push({...f,id:nid()});guardar();close();render();toast("✓ Guardado")};
 const d=document.getElementById("jdel");if(d)d.onclick=()=>{if(!confirm("¿Borrar este gasto fijo?"))return;DB.fijos=DB.fijos.filter(y=>y.id!==f.id);guardar();close();render()}}

function pagarFijo(id,si){const m=S.mes,f=DB.fijos.find(y=>y.id===id);if(!f)return;DB.pagos[m]=DB.pagos[m]||{};
 if(si){const dia=Math.min(f.dia||+hoyS().slice(8),diasMes(m)),fecha=m===mesHoy()?hoyS():m+"-"+p2(dia);
  const mv={id:nid(),t:"g",f:fecha,m:f.m,cat:f.cat,det:f.nom,medio:"Transferencia",fijo:f.id};DB.mov.push(mv);DB.pagos[m][id]=mv.id;toast("✓ "+f.nom+" pagado")}
 else{const mid=DB.pagos[m][id];DB.mov=DB.mov.filter(y=>y.id!==mid);delete DB.pagos[m][id]}
 guardar();render(true)}

/* ===== Importar Excel ===== */
async function importarExcel(file){
 try{if(!window.XLSX)await cargarJS("../lib/xlsx.full.min.js")}catch(e){return toast("No se pudo abrir el lector de Excel")}
 const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});let nuevos=[];
 wb.SheetNames.forEach(sn=>{const R=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true});
  let h=-1,cF=-1,cD=-1,cM=-1,cC=-1;
  for(let i=0;i<Math.min(15,R.length)&&h<0;i++){const r=(R[i]||[]).map(v=>String(v||"").toLowerCase());
   r.forEach((v,j)=>{if(cF<0&&/fecha/.test(v))cF=j;if(cD<0&&/(detalle|concepto|descrip|gasto|item)/.test(v))cD=j;if(cM<0&&/(monto|importe|total|precio|\$)/.test(v))cM=j;if(cC<0&&/categ|rubro|tipo/.test(v))cC=j});
   if(cM>=0&&(cD>=0||cF>=0))h=i;else{cF=cD=cM=cC=-1}}
  if(h<0)return;
  for(let i=h+1;i<R.length;i++){const r=R[i]||[];let m=typeof r[cM]==="number"?r[cM]:num(r[cM]);if(!m)continue;
   let f=cF>=0?r[cF]:null;if(f instanceof Date)f=f.getFullYear()+"-"+p2(f.getMonth()+1)+"-"+p2(f.getDate());
   else if(typeof f==="string"&&/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/.test(f)){const[,d,mm,y]=f.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/);f=(y.length===2?"20"+y:y)+"-"+p2(+mm)+"-"+p2(+d)}
   else f=hoyS();
   const det=cD>=0?String(r[cD]||"").trim():"";const t=m<0?"g":"g";
   nuevos.push({id:nid(),t,f,m:Math.abs(m),cat:adivinarCat(det+" "+(cC>=0?r[cC]:"")),det,medio:""})}});
 if(!nuevos.length)return toast("No encontré columnas de fecha / detalle / monto");
 if(!confirm("Encontré "+nuevos.length+" gastos por "+ars(nuevos.reduce((a,x)=>a+x.m,0))+". ¿Los cargo?"))return;
 DB.mov=DB.mov.concat(nuevos);guardar();S.mes=mesDe(nuevos[nuevos.length-1].f);S.sec="movs";render();toast("✓ "+nuevos.length+" gastos cargados")}
function adivinarCat(s){s=s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
 const R=[["super",/super|coto|dia |disco|jumbo|carrefour|chango|almacen|verduler|carnic|panader/],["casa",/luz|edenor|edesur|gas|metrogas|naturgy|agua|aysa|absa/],["internet",/internet|telefon|celular|personal|movistar|claro|fibertel|telecentro|cable|flow|netflix|spotify/],["auto",/nafta|ypf|shell|axion|combust|auto|seguro|patente|peaje|mecanic|gomeria|estacion/],["salud",/farmac|medic|prepaga|osde|swiss|obra social|doctor|odont|analisis/],["comida",/resto|pizza|delivery|rappi|pedidosya|cafe|bar /],["tarjeta",/tarjeta|visa|master|cuota|prestamo|banco/],["impuestos",/impuesto|abl|arba|afip|arca|monotrib|municip|rentas/],["ropa",/ropa|zapat|zapatilla/],["mascota",/veterin|mascota|perro|gato/],["familia",/hijo|colegio|escuela|cumple|regalo/]];
 for(const[k,re]of R)if(re.test(s))return k;return"otros"}

/* ===== Interfaz ===== */
function modal(h){document.getElementById("modal").innerHTML=`<div class="modal"><div class="box" role="dialog" aria-modal="true">${h}</div></div>`;
 const M=document.getElementById("modal");M.querySelector(".modal").onclick=e=>{if(e.target.classList.contains("modal"))close()};M.querySelectorAll("[data-close]").forEach(b=>b.onclick=close)}
function close(){document.getElementById("modal").innerHTML=""}
let tt;function toast(t){document.querySelectorAll(".toast").forEach(e=>e.remove());const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);clearTimeout(tt);tt=setTimeout(()=>d.remove(),2200)}

function render(keep){
 const y=keep?scrollY:0;
 const h=new Date().getHours();
 document.getElementById("hola").textContent=(h<12?"Buen día":h<20?"Buenas tardes":"Buenas noches")+", "+(DB.nombre||"José");
 const tit=(SECS.find(s=>s[0]===S.sec)||[0,0,"Más"])[2];
 document.getElementById("tit").textContent=S.sec==="inicio"?"Mis Cuentas":tit;
 const it=([k,e,n])=>`<button class="it ${S.sec===k?"on":""}" data-ir="${k}">${ico(k)}${n}</button>`;
 document.getElementById("nav").innerHTML=`<div class="logo"><i>$</i>Mis Cuentas</div><div class="gt">Resumen</div>${SECS.slice(0,3).map(it).join("")}<div class="gt">Plata</div>${SECS.slice(3,6).map(it).join("")}<div class="gt">Cuenta</div>${it(SECS[6])}<button class="btn full add" data-nuevo="g">＋ Cargar gasto</button>`;
 const mb=[["inicio","🏠","Inicio"],["movs","📋","Movimientos"],["+"],["metricas","📊","Métricas"],["mas","☰","Más"]];
 const enMas=!["inicio","movs","metricas"].includes(S.sec);
 document.getElementById("mbar").innerHTML=mb.map(b=>b[0]==="+"?`<button class="plus" data-nuevo="g" aria-label="Cargar gasto">＋</button>`:`<button data-ir="${b[0]}" class="${S.sec===b[0]||(b[0]==="mas"&&enMas)?"on":""}">${ico(b[0])}${b[2]}</button>`).join("");
 document.getElementById("main").innerHTML=V[S.sec]();
 bind();window.scrollTo(0,y)}

function bind(){
 const $=s=>document.querySelectorAll(s);
 $("[data-ir]").forEach(b=>b.onclick=()=>{S.sec=b.dataset.ir;render()});
 $("[data-nuevo]").forEach(b=>b.onclick=()=>form(b.dataset.nuevo));
 $("[data-mes]").forEach(b=>b.onclick=()=>{S.mes=mesMas(S.mes,+b.dataset.mes);render(true)});
 $("[data-mov]").forEach(b=>b.onclick=()=>form(null,DB.mov.find(x=>x.id===b.dataset.mov)));
 $("[data-fijo]").forEach(b=>b.onchange=()=>pagarFijo(b.dataset.fijo,b.checked));
 $("[data-pagar]").forEach(b=>b.onclick=()=>pagarFijo(b.dataset.pagar,true));
 $("[data-efijo]").forEach(b=>b.onclick=()=>formFijo(DB.fijos.find(f=>f.id===b.dataset.efijo)));
 $("[data-tip]").forEach(b=>{b.onmousemove=e=>{const t=document.getElementById("tip");t.textContent=b.dataset.tip;t.style.display="block";
  t.style.left=Math.min(e.clientX+14,innerWidth-t.offsetWidth-8)+"px";t.style.top=(e.clientY-44)+"px"};b.onmouseleave=()=>document.getElementById("tip").style.display="none"});
 const sec=S.sec,g=id=>document.getElementById(id);
 if(sec==="movs"){g("q").oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;render(true);const n=g("q");n.focus();n.setSelectionRange(p,p)};
  $("[data-filtro]").forEach(b=>b.onclick=()=>{S.filtro=b.dataset.filtro;render(true)})}
 if(sec==="metricas")$("[data-rango]").forEach(b=>b.onclick=()=>{S.rango=+b.dataset.rango;render(true)});
 if(sec==="fijos"){g("nfijo").onclick=()=>formFijo();g("ndeuda").onclick=()=>formDeuda();
  $("[data-edeuda]").forEach(b=>b.onclick=()=>formDeuda(DB.deudas.find(d=>d.id===b.dataset.edeuda)));$("[data-pagod]").forEach(b=>b.onclick=()=>pagarDeuda(b.dataset.pagod));const s=g("sugf");if(s)s.onclick=()=>{[["Luz","casa",10],["Gas","casa",15],["Agua","casa",20],["Internet y TV","internet",10],["Celular","internet",12],["Seguro del auto","auto",5],["Patente","auto",15],["Prepaga / obra social","salud",10],["Tarjeta de crédito","tarjeta",8]].forEach(([nom,cat,dia])=>DB.fijos.push({id:nid(),nom,cat,dia,m:0}));guardar();render();toast("Listo: completá los montos tocando cada uno")}}
 if(sec==="calc"){$("[data-calc]").forEach(b=>b.onclick=()=>{S.calc=b.dataset.calc;render(true)});
  $(".k").forEach(i=>{i.oninput=()=>{if(i.inputMode==="numeric"&&!/^c3$|^n1$/.test(i.id)){const v=num(i.value);i.value=v?ars(v):""}calcular()};i.onchange=calcular});
  $("[data-k]").forEach(b=>b.onclick=()=>tecla(b.dataset.k));calcular()}
 if(sec==="mp"){g("mptraer").onclick=mpTraer;
  $("[data-mpok]").forEach(b=>b.onclick=()=>{const p=MP.pagos.find(x=>x.id===b.dataset.mpok);
   form("g",{t:"g",f:p.fecha.slice(0,10),m:Math.round(p.monto),cat:adivinarCat((p.desc||"")+" "+(p.nombre||"")),det:p.desc||p.nombre||"",medio:"Mercado Pago",mp:p.id})});
  $("[data-mpno]").forEach(b=>b.onclick=()=>{DB.mpIgn[b.dataset.mpno]=1;guardar();render(true)})}
 if(sec==="ajustes"){g("gymb").onclick=()=>{if(location.protocol==="file:")return toast("Funciona cuando esté publicada");gymTraer(true).then(()=>{if(GYM.estado==="sin")toast("Entrá una vez al sistema del gym en este dispositivo")})};g("anom").onchange=e=>{DB.nombre=e.target.value.trim()||"José";guardar();render(true)};
  $("[data-pres]").forEach(i=>{i.oninput=()=>{const v=num(i.value);i.value=v?ars(v):""};i.onchange=()=>{const v=num(i.value);if(v)DB.pres[i.dataset.pres]=v;else delete DB.pres[i.dataset.pres];guardar();toast("✓ Tope guardado")}});
  g("xlsb").onclick=()=>g("xls").click();g("xls").onchange=e=>{const f=e.target.files[0];if(f)importarExcel(f);e.target.value=""};
  g("bk").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:"application/json"}));a.download="mis-cuentas-"+hoyS()+".json";a.click();toast("✓ Copia descargada")};
  g("rsb").onclick=()=>g("rs").click();g("rs").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.mov))throw 0;
   if(!confirm("Esto reemplaza lo que hay ahora por la copia ("+d.mov.length+" movimientos). ¿Seguro?"))return;DB=d;cargarDefaults();guardar();render();toast("✓ Copia recuperada")}catch(x){toast("Ese archivo no es una copia válida")}};
  g("borrar").onclick=()=>{if(!confirm("¿Borrar TODOS tus datos de este dispositivo? Guardá una copia antes."))return;if(!confirm("¿Seguro seguro?"))return;localStorage.removeItem(KEY);cargar();render();toast("Borrado")}}
}
function cargarDefaults(){["mov","fijos","deudas"].forEach(k=>DB[k]=DB[k]||[]);["pres","pagos","mpIgn"].forEach(k=>DB[k]=DB[k]||{})}
render();
gymTraer(false);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)gymTraer(false)});
</script>
